name: Traditional Chinese Crystal build
on:
  workflow_dispatch:
  push:
    branches:
      - work/zh-hant-tw

concurrency:
  group: zh-hant-build-work
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  translate-and-build:
    name: Generate zh-Hant text, fonts, and compile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make git bison libpng-dev pkg-config rsync fonts-noto-cjk
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install openpyxl opencc-python-reimplemented Pillow pyboy
      - name: Syntax check all Python helpers
        run: .venv/bin/python -m compileall -q tools
      - name: Create translated workbook and compile ROM
        shell: bash
        run: |
          source .venv/bin/activate
          bash tools/build_zh_tw.sh 2>&1 | tee zh_tw_build.log
      - name: Headless GBC emulator smoke test
        if: success()
        run: |
          .venv/bin/python tools/zh_tw_smoke.py build/pokecrystal11.gbc --output .
      - name: Build verified clean Crystal and generate a patch
        if: success()
        run: |
          git clone --depth 1 https://github.com/pret/pokecrystal.git clean_crystal
          git clone --depth 1 --branch v1.0.1 https://github.com/gbdev/rgbds.git clean_rgbds
          make -C clean_rgbds -j2
          make -C clean_crystal -j2 crystal11 RGBDS="$PWD/clean_rgbds/"
          .venv/bin/python tools/zh_tw_ips.py clean_crystal/pokecrystal11.gbc build/pokecrystal11.gbc
      - name: Record ROM checksums (do not upload copyrighted ROM)
        if: success()
        run: find build -maxdepth 1 -name '*.gbc' -type f -exec sha256sum {} \; > zh_tw_rom_sha256.txt
      - name: Upload diagnostics and translated workbook only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zh-hant-translated-text-and-build-reports
          path: |
            text.zh-TW.xlsx
            zh_tw_*_report.json
            zh_tw_build.log
            zh_tw_rom_sha256.txt
            zh_tw_boot_*.png
            zh_tw_emulator_report.json
            Crystal_Traditional_Chinese_v1.1.ips
            zh_tw_patch_manifest.json
          if-no-files-found: warn
