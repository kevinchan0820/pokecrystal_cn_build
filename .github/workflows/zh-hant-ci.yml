name: 1.x Taiwan / Hong Kong character input build
on:
  workflow_dispatch:
  push:
    branches:
      - feature/zh-hant-tw-hk-1x

concurrency:
  group: zh-hant-1x-build-work
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  translate-and-build:
    name: Generate zh-Hant text, fonts, and compile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ZH_TW_SOURCE_BRANCH: feature/zh-hant-tw-hk-1x
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make git bison libpng-dev pkg-config rsync fonts-noto-cjk
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install openpyxl opencc-python-reimplemented Pillow pyboy
      - name: Syntax check all Python helpers
        run: .venv/bin/python -m compileall -q tools
      - name: Verify menu localization parser regressions
        run: .venv/bin/python -m unittest discover -s tools -p 'test_zh_tw_*.py' -v
      - name: Create translated workbook and compile ROM
        shell: bash
        run: |
          source .venv/bin/activate
          bash tools/build_zh_tw.sh 2>&1 | tee zh_tw_build.log
      - name: Headless GBC emulator smoke test
        if: success()
        run: |
          .venv/bin/python tools/zh_tw_smoke.py build/pokecrystal11.gbc --output .
      - name: Capture real Options and 1-8 frame UI
        if: success()
        run: |
          .venv/bin/python tools/zh_tw_ui_capture.py build/pokecrystal11.gbc --output .
      - name: Probe actual 1.x naming entry and switch controls in PyBoy
        if: success()
        run: |
          find build -maxdepth 1 -name '*.sym' -print
          .venv/bin/python tools/zh_tw_naming_probe.py build/pokecrystal11.gbc --output .
      - name: Build verified clean Crystal and generate a patch
        if: success()
        run: |
          git clone --depth 1 https://github.com/pret/pokecrystal.git clean_crystal
          git clone --depth 1 --branch v1.0.1 https://github.com/gbdev/rgbds.git clean_rgbds
          make -C clean_rgbds -j2
          make -C clean_crystal -j2 crystal11 RGBDS="$PWD/clean_rgbds/"
          .venv/bin/python tools/zh_tw_ips.py clean_crystal/pokecrystal11.gbc build/pokecrystal11.gbc --output Crystal_Traditional_Chinese_TWHK_1x.ips
      - name: Record ROM checksums (do not upload copyrighted ROM)
        if: success()
        run: find build -maxdepth 1 -name '*.gbc' -type f -exec sha256sum {} \; > zh_tw_rom_sha256.txt
      - name: Upload diagnostics and translated workbook only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zh-hant-1x-twhk-input-prototype-and-reports
          path: |
            text.zh-TW.xlsx
            zh_tw_*_report.json
            zh_tw_build.log
            zh_tw_rom_sha256.txt
            zh_tw_*.png
            zh_tw_emulator_report.json
            Crystal_Traditional_Chinese_TWHK_1x.ips
            zh_tw_patch_manifest.json
          if-no-files-found: warn
